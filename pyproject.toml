[project]
name = "luge-start-tracker"
version = "0.1.0"
description = "Luge start tracking (OpenCV + YOLO + sled sensor)"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
]

[dependency-groups]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "notebook>=7.6.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[tool.uv]
package = false
default-groups = ["notebooks"]
